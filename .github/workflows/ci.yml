name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No untrusted input used in run steps — safe from injection
jobs:
  build:
    name: Build & Test
    # No OS/Node matrix: the package only runs in workerd (Cloudflare Workers),
    # so tests exercise a cloudflare:sockets mock — the host platform and Node
    # version add no coverage. One Linux runner on current LTS is enough.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # pnpm test would re-run lint; invoke vitest directly instead
      - name: Test
        run: pnpm vitest run --coverage
